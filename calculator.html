<!DOCTYPE html>
  <html>

    <head>
      
      <title>Calculator</title>

      <style>

        body {
          font-family: Arial;
          background-color: black;
        }

        .calculation {
          color: white;
          font-size: 45px;
          margin-top: 15px;
          margin-bottom: 5px;
        }

        .calculator-button {
          background-color: rgb(51, 51, 51);
          color: white;
          height: 60px;
          width: 60px;
          border-radius: 60px;
          border: none;
          font-size: 26px;
          cursor: pointer;
          margin-right: 5px;
        }

        .calculator-button2 {
          background-color: rgb(254, 160, 10);
          color: white;
          height: 60px;
          width: 60px;
          border-radius: 60px;
          border: none;
          font-size: 26px;
          cursor: pointer;
          margin-right: 5px;
        }

        .clear-button {
          background-color: rgb(254, 160, 10);
          color: white;
          height: 50px;
          width: 100px;
          border-radius: 5px;
          border: none;
          font-size: 26px;
          cursor: pointer;
          margin-right: 5px;
        }


      </style>

    </head>

    <body>

      <p>
        Calculator
      </p>

      <p class="js-calculation calculation"></p>
      
      <p>
      <button onclick="
        updateCalculation('1');
        " class="calculator-button">
        1
      </button>

      <button onclick="
        updateCalculation('2');
        " class="calculator-button">
        2
      </button>

      <button onclick="
        updateCalculation('3');
        " class="calculator-button">
        3
      </button>

      <button onclick="
        updateCalculation(' + ');
        " class="calculator-button2">
        +
      </button>
      </p>

      <p>
        <button onclick="
        updateCalculation('4');
        " class="calculator-button">
        4
      </button>

      <button onclick="
        updateCalculation('5');
        " class="calculator-button">
        5
      </button>

      <button onclick="
        updateCalculation('6');
        " class="calculator-button">
        6
      </button>

      <button onclick="
        updateCalculation(' - ');
        " class="calculator-button2">
        -
      </button>
      </p>

      <p>
        <button onclick="
        updateCalculation('7');
        " class="calculator-button">
        7
      </button>

      <button onclick="
        updateCalculation('8');
        " class="calculator-button">
        8
      </button>

      <button onclick="
        updateCalculation('9');
        " class="calculator-button">
        9
      </button>

      <button onclick="
        updateCalculation(' * ');
        " class="calculator-button2">
        *
      </button>
      </p>

      <p>
      <button onclick="
        updateCalculation('0');
        " class="calculator-button">
        0
      </button>

      <button onclick="
        
        updateCalculation('.');
        " class="calculator-button">
        .
      </button>

      <button onclick="
        updateCalculation(' / ');
        " class="calculator-button">
        /
      </button>

       <button onclick="
        calculation = eval(calculation);

        displayCalculation();

        localStorage.setItem('calculation', calculation);
        " class="calculator-button2">
        =
      </button>
      </p>

      <p>
      <button onclick="
        calculation = '';
        
        displayCalculation();

        localStorage.setItem('calculation', calculation);
        " class="clear-button">
        Clear
      </button>
      </p>

      <script>

        let calculation = localStorage.getItem('calculation') || '';

        displayCalculation();

        function updateCalculation (value) {
          calculation += value;

          displayCalculation();

          localStorage.setItem('calculation', calculation);
        }
      

        function displayCalculation () {
          document.querySelector('.js-calculation')
            .innerHTML = calculation;
        }
      </script>

    </body>

  </html>
